<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vinoth Veliappan — Portfolio</title>
    <!--
      GitHub Pages SPA redirect trick.
      When GH Pages returns a 404 (deep link), this page
      converts the URL to a query param and redirects to index.html,
      where the app reads it and restores the route.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keep /repo-name/ prefix
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
